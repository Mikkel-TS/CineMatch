[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematch-model"
version = "0.1.0"
description = "MovieLens explicit-rating matrix factorization with new-user onboarding"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "torch>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cinematch = "cinematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
